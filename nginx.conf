server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React/Vite single-page application routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite assets are normally fingerprinted, so they can be cached.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Always revalidate the HTML entry point after a deployment.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
